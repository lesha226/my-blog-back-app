spring.datasource.url=jdbc:h2:mem:blogtestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
app.cors.enabled=false
app.cors.mapping=temp-getMapping
app.cors.allowed-origins=temp-getAllowedOrigins
app.cors.allowed-methods=temp-getAllowedMethods
app.cors.allowed-headers=temp-getAllowedHeaders
app.cors.allow-credentials=true
app.cors.max-age=-123
server.servlet.contextPath=/api