spring.application.name=my-blog-back-app
spring.datasource.url=jdbc:h2:mem:blogdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
app.cors.enabled=true
app.cors.allowed-origins=*
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,HEAD
app.cors.allowed-headers=*
app.cors.allow-credentials=false
app.cors.max-age=-1
server.servlet.contextPath=/api